[package]
name = "bcl"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[lib]
name = "bcl"
path = "src/lib.rs"

[[bin]]
name = "bcl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
regex = "1"
async-trait = "0.1"
ferridriver = "0.5"

clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
