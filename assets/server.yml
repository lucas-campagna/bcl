
test:
    # server command start a local server
  - server:
      /health: health
      /prod:
        GET: prod-get
        POST: prod-post
    base_path: /api


health:
  - define: RESPONSE.body
    value: server is working


prod-get:
  - if:
      var: REQUEST.QUERY_PARAMS.log_scale
      value: "true"
    then:
      - define: RESPONSE.body
        value: {result: $REQUEST.BODY.a * $REQUEST.BODY.b}
    else:
      - define: RESPONSE.body
        value: {result: $REQUEST.BODY.a + $REQUEST.BODY.b}


prod-post:
  - define: RESPONSE.status
    value: 200
  - if:
      var: REQUEST.QUERY_PARAMS.log_scale
      value: "true"
    then:
      - define: RESPONSE.body
        value: {result: $REQUEST.BODY.a * $REQUEST.BODY.b}
    else:
      - define: RESPONSE.body
        value: {result: $REQUEST.BODY.a + $REQUEST.BODY.b}
