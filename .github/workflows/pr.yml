name: PR Validation

on:
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fast-check:
    name: Fast PR Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build project (debug)
        run: cargo build

      - name: Run unit tests
        run: cargo test --lib

  full-integration:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    needs: fast-check
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' || github.event.action == 'opened' || github.event.action == 'reopened'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libfreetype6-dev libasound2-dev libexpat1-dev \
            libxcb-composite0-dev libx11-xcb-dev libxcb-randr0-dev \
            libxcb-image0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Build project (release)
        run: cargo build --release

      - name: Install Playwright Chromium
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Start Chrome CDP
        run: |
          # Use the installed Chrome with remote debugging
          google-chrome-stable \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --remote-debugging-address=0.0.0.0 \
            --user-data-dir=/tmp/chrome-profile \
            "about:blank" &
          CHROME_PID=$!
          echo "CHROME_PID=$CHROME_PID" >> $GITHUB_ENV
          # Wait for CDP to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "Chrome CDP ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          ./tests/run_tests.sh
        env:
          BROWSER_URL: http://127.0.0.1:9222

      - name: Stop Chrome
        if: always()
        run: |
          kill $CHROME_PID || true