name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build project
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --lib

  integration-test:
    name: Integration Tests (Carbonyl)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Carbonyl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libfreetype6-dev libasound2-dev libexpat1-dev \
            libxcb-composite0-dev libx11-xcb-dev libxcb-randr0-dev \
            libxcb-image0-dev

      - name: Build Carbonyl (headless Chrome)
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/fathyb/carbonyl.git /tmp/carbonyl
          cd /tmp/carbonyl
          cargo build --release --bin carbonyl
          echo "/tmp/carbonyl/target/release" >> $GITHUB_PATH

      - name: Start Carbonyl CDP server
        run: |
          /tmp/carbonyl/target/release/carbonyl --no-sandbox --headless --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 "about:blank" &
          CARBONYL_PID=$!
          echo "CARBONYL_PID=$CARBONYL_PID" >> $GITHUB_ENV
          # Wait for CDP to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "Carbonyl CDP ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          ./tests/run_tests.sh
        env:
          BROWSER_URL: http://127.0.0.1:9222

      - name: Stop Carbonyl
        if: always()
        run: |
          kill $CARBONYL_PID || true

  # Alternative: Use Playwright's pre-built browsers
  integration-test-playwright:
    name: Integration Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Playwright and browsers
        run: |
          # Use Playwright's browser install script
          curl -fsSL https://playwright.azureedge.net/builds/driver/linux-x64/1.40.0/playwright-linux-x64.zip -o /tmp/playwright.zip
          unzip -q /tmp/playwright.zip -d /tmp/playwright
          /tmp/playwright/install-deps.sh
          /tmp/playwright/install-driver.sh

      - name: Build project
        run: cargo build --release

      - name: Start Playwright CDP server
        run: |
          # Use Playwright's Chromium with CDP
          /tmp/playwright/driver/package/.local-browsers/chromium-*/chrome-linux/chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9222 \
            --remote-debugging-address=0.0.0.0 \
            --user-data-dir=/tmp/chrome-profile \
            "about:blank" &
          CHROME_PID=$!
          echo "CHROME_PID=$CHROME_PID" >> $GITHUB_ENV
          # Wait for CDP to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "Playwright Chromium CDP ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          ./tests/run_tests.sh
        env:
          BROWSER_URL: http://127.0.0.1:9222

      - name: Stop Chrome
        if: always()
        run: |
          kill $CHROME_PID || true