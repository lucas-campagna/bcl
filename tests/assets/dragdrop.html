<!doctype html>
<html>
<head>
  <title>Drag & Drop Test Page</title>
  <meta charset="utf-8">
  <style>
    .draggable { width: 100px; height: 100px; background: #4CAF50; color: white; display: flex; align-items: center; justify-content: center; cursor: move; margin: 10px; }
    .dropzone { width: 200px; height: 200px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; margin: 10px; }
    .dropzone.over { border-color: #4CAF50; background: #e8f5e9; }
    #log { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Drag & Drop Test</h1>
  
  <div id="drag-source" class="draggable" draggable="true">Drag Me</div>
  <div id="drop-target" class="dropzone">Drop Here</div>
  
  <div id="log"></div>
  
  <script>
    const source = document.getElementById('drag-source');
    const target = document.getElementById('drop-target');
    const log = document.getElementById('log');
    
    function logMsg(msg) {
      log.textContent += msg + '\n';
      log.scrollTop = log.scrollHeight;
    }
    
    source.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', 'dragged-content');
      logMsg('dragstart');
    });
    
    source.addEventListener('dragend', () => logMsg('dragend'));
    
    target.addEventListener('dragover', (e) => {
      e.preventDefault();
      target.classList.add('over');
    });
    
    target.addEventListener('dragleave', () => {
      target.classList.remove('over');
    });
    
    target.addEventListener('drop', (e) => {
      e.preventDefault();
      target.classList.remove('over');
      const data = e.dataTransfer.getData('text/plain');
      logMsg(`drop: ${data}`);
      target.textContent = `Dropped: ${data}`;
    });
  </script>
</body>
</html>
