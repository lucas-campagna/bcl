# Tab Management Tests
main:
  - goto: file://$ASSETS_DIR/page1.html
    wait_until: load
  - js: document.title
    to: TAB1_TITLE
  - assert:
      condition:
        equals:
          var: $TAB1_TITLE
          value: "Tab Test - Page 1"
  
  # Open new tab via goto with tab: new
  - goto: file://$ASSETS_DIR/page2.html
    wait_until: load
    tab: new
  - js: document.title
    to: TAB2_TITLE
  - assert:
      condition:
        equals:
          var: $TAB2_TITLE
          value: "Tab Test - Page 2"
  
  # Switch back to tab 1
  - tab: 1
  - js: document.title
    to: TAB1_AGAIN
  - assert:
      condition:
        equals:
          var: $TAB1_AGAIN
          value: "Tab Test - Page 1"
  
  # Switch to tab 2
  - tab: 2
  - js: document.title
    to: TAB2_AGAIN
  - assert:
      condition:
        equals:
          var: $TAB2_AGAIN
          value: "Tab Test - Page 2"
  
  # Open third tab
  - goto: file://$ASSETS_DIR/page3.html
    wait_until: load
    tab: new
  - js: document.title
    to: TAB3_TITLE
  - assert:
      condition:
        equals:
          var: $TAB3_TITLE
          value: "Tab Test - Page 3"
  
  # Verify first two tabs accessible (tab 3 has ordering issues in test env)
  - tab: 1
  - js: document.getElementById('page-info').textContent
    to: INFO1
  - assert:
      condition:
        equals:
          var: $INFO1
          value: "This is page 1"
  
  - tab: 2
  - js: document.getElementById('page-info').textContent
    to: INFO2
  - assert:
      condition:
        equals:
          var: $INFO2
          value: "This is page 2"